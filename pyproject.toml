[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-search-kit"
version = "0.2.0"
description = "A local, evidence-based job application workflow for human-directed AI assistants"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
jobkit = "jobkit.__main__:main"

[tool.setuptools.packages.find]
include = ["jobkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
