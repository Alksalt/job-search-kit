name: Check public toolkit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test synthetic workflows
        run: python -m unittest discover -s tests -v
      - name: Exercise the offline demo
        run: python -m jobkit demo
      - name: Check the public file boundary
        run: python -m jobkit.release check
